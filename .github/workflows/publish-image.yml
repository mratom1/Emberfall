name: Publish release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the verified commit to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker build --pull --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:sha-$GITHUB_SHA" .
          docker push "$image:sha-$GITHUB_SHA"
          printf 'Published image: `%s:sha-%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
