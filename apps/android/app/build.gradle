plugins { id 'com.android.application' }
android {
    namespace 'game.emberfall'
    compileSdk 36
    defaultConfig {
        applicationId 'game.emberfall.kingdoms'
        minSdk 24
        targetSdk 36
        versionCode 50000
        versionName '5.0.0'
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.17.0' }
