name: Build Blender Guardian L1-L15

on:
  workflow_dispatch:
    inputs:
      levels:
        description: Guardian level range/list
        required: true
        default: 1-15
        type: string
      preview_size:
        description: Preview resolution
        required: true
        type: choice
        default: '512'
        options: ['384', '512', '768']
      save_blend:
        description: Include editable .blend files
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'tools/blender/generate_guardian_v2.py'
      - 'tools/blender/generate_army_v3.py'
      - '.github/workflows/blender-army.yml'

permissions:
  contents: read

jobs:
  guardian-levels-01-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate premium Guardian source
        run: |
          python3 -m py_compile tools/blender/generate_guardian_v2.py tools/blender/generate_army_v3.py

      - name: Install Blender headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 imagemagick
          xvfb-run -a blender -b --python-exit-code 1 --python-expr "import bpy; print('Blender ready:', bpy.app.version_string)"

      - name: Generate smooth Guardian levels
        shell: bash
        env:
          REQUESTED_LEVELS: ${{ github.event_name == 'workflow_dispatch' && inputs.levels || '1-15' }}
          REQUESTED_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_size || '512' }}
          REQUESTED_BLEND: ${{ github.event_name == 'workflow_dispatch' && inputs.save_blend || 'true' }}
        run: |
          set -euxo pipefail
          extra=()
          [[ "$REQUESTED_BLEND" == "true" ]] && extra+=(--save-blend)
          xvfb-run -a blender -b --python-exit-code 1 --python tools/blender/generate_guardian_v2.py -- \
            --levels "$REQUESTED_LEVELS" \
            --output generated/guardian-v2 \
            --preview-size "$REQUESTED_SIZE" "${extra[@]}"

      - name: Verify Guardian output
        shell: bash
        env:
          REQUESTED_LEVELS: ${{ github.event_name == 'workflow_dispatch' && inputs.levels || '1-15' }}
          REQUESTED_BLEND: ${{ github.event_name == 'workflow_dispatch' && inputs.save_blend || 'true' }}
        run: |
          set -euxo pipefail
          expected=$(python3 - <<'PY'
          import os
          text=os.environ['REQUESTED_LEVELS']
          vals=set()
          for c in text.split(','):
              c=c.strip()
              if not c: continue
              if '-' in c:
                  a,b=map(int,c.split('-',1)); vals.update(range(min(a,b),max(a,b)+1))
              else: vals.add(int(c))
          print(len([x for x in vals if 1 <= x <= 15]))
          PY
          )
          test $(find generated/guardian-v2 -name '*.glb' | wc -l) -eq "$expected"
          test $(find generated/guardian-v2 -name '*.png' | wc -l) -eq "$expected"
          test $(find generated/guardian-v2 -name 'metadata.json' | wc -l) -eq "$expected"
          if [[ "$REQUESTED_BLEND" == "true" ]]; then
            test $(find generated/guardian-v2 -name '*.blend' | wc -l) -eq "$expected"
          fi
          test -f generated/guardian-v2/manifest.json

      - name: Build L1-L15 preview sheet
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t imgs < <(find generated/guardian-v2/guardian -name 'guardian-level-*.png' | sort)
          if [[ ${#imgs[@]} -eq 15 ]]; then
            montage "${imgs[@]}" -background '#111923' -geometry 320x320+8+8 -tile 5x3 generated/guardian-v2/guardian-levels-01-15-sheet.png
          fi

      - name: Upload Guardian Blender artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-smooth-v2-l01-l15-${{ github.run_number }}
          path: generated/guardian-v2/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
