name: Build Blender Guardian L1-L15

on:
  workflow_dispatch:
    inputs:
      levels:
        description: Guardian level range/list
        required: true
        default: 1-15
        type: string
      preview_size:
        description: Preview resolution
        required: true
        type: choice
        default: '768'
        options: ['512', '768']
      save_blend:
        description: Include editable .blend files
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'tools/blender/generate_guardian_v5.py'
      - 'tools/blender/generate_guardian_v4.py'
      - 'tools/blender/generate_guardian_v3.py'
      - 'tools/blender/generate_army_v3.py'
      - '.github/workflows/blender-army.yml'

permissions:
  contents: read

jobs:
  guardian-levels-01-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MAKEHUMAN_BASE_OBJ: /tmp/makehuman-base.obj
    steps:
      - uses: actions/checkout@v4

      - name: Validate Guardian v5 source
        run: |
          python3 -m py_compile tools/blender/generate_guardian_v5.py tools/blender/generate_guardian_v4.py tools/blender/generate_guardian_v3.py tools/blender/generate_army_v3.py

      - name: Install Blender headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 imagemagick curl
          xvfb-run -a blender -b --python-exit-code 1 --python-expr "import bpy; print('Blender ready:', bpy.app.version_string)"

      - name: Fetch CC0 MakeHuman HM08 base mesh
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/makehumancommunity/mpfb2/master/src/mpfb/data/3dobjs/base.obj \
            -o "$MAKEHUMAN_BASE_OBJ"
          test -s "$MAKEHUMAN_BASE_OBJ"
          grep -q "explicitly released as CC0" "$MAKEHUMAN_BASE_OBJ"
          grep -q '^g body$' "$MAKEHUMAN_BASE_OBJ"

      - name: Generate Guardian v5 Level 1 through 15
        shell: bash
        env:
          REQUESTED_LEVELS: ${{ github.event_name == 'workflow_dispatch' && inputs.levels || '1-15' }}
          REQUESTED_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_size || '768' }}
          REQUESTED_BLEND: ${{ github.event_name == 'workflow_dispatch' && inputs.save_blend || 'true' }}
        run: |
          set -euxo pipefail
          extra=()
          [[ "$REQUESTED_BLEND" == "true" ]] && extra+=(--save-blend)
          xvfb-run -a blender -b --python-exit-code 1 --python tools/blender/generate_guardian_v5.py -- \
            --levels "$REQUESTED_LEVELS" \
            --output generated/guardian-v5 \
            --preview-size "$REQUESTED_SIZE" "${extra[@]}"

      - name: Verify Guardian v5 output
        shell: bash
        env:
          REQUESTED_LEVELS: ${{ github.event_name == 'workflow_dispatch' && inputs.levels || '1-15' }}
          REQUESTED_BLEND: ${{ github.event_name == 'workflow_dispatch' && inputs.save_blend || 'true' }}
        run: |
          set -euxo pipefail
          expected=$(python3 - <<'PY'
          import os
          text=os.environ['REQUESTED_LEVELS'];vals=set()
          for c in text.split(','):
              c=c.strip()
              if not c: continue
              if '-' in c:
                  a,b=map(int,c.split('-',1));vals.update(range(min(a,b),max(a,b)+1))
              else:vals.add(int(c))
          print(len([x for x in vals if 1<=x<=15]))
          PY
          )
          test $(find generated/guardian-v5 -name '*.glb' | wc -l) -eq "$expected"
          test $(find generated/guardian-v5 -name '*.png' | wc -l) -eq "$expected"
          test $(find generated/guardian-v5 -name 'metadata.json' | wc -l) -eq "$expected"
          if [[ "$REQUESTED_BLEND" == "true" ]]; then
            test $(find generated/guardian-v5 -name '*.blend' | wc -l) -eq "$expected"
          fi
          test -f generated/guardian-v5/manifest.json

      - name: Build Guardian v5 L1-L15 preview sheet
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t imgs < <(find generated/guardian-v5/guardian -name 'guardian-level-*.png' | sort)
          if [[ ${#imgs[@]} -eq 15 ]]; then
            montage "${imgs[@]}" -background '#111827' -geometry 360x360+8+8 -tile 5x3 generated/guardian-v5/guardian-v5-levels-01-15-sheet.png
          fi

      - name: Upload Guardian v5 Blender artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-reference-v5-l01-l15-${{ github.run_number }}
          path: generated/guardian-v5/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
