name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - name: Check shell syntax
        run: bash -n scripts/deploy.sh scripts/smoke-container.sh scripts/deploy-over-ssh.sh
      - name: Build container and test its runtime
        run: |
          docker build --pull -t emberfall:ci .
          bash scripts/smoke-container.sh emberfall:ci
