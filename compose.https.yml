services:
  game:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /app/data
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PUBLIC_URL: "https://${DOMAIN}"
    volumes:
      - emberfall_data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  emberfall_data:
  caddy_data:
  caddy_config:
